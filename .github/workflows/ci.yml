name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Build npm release candidate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Pack and record SHA-256
        shell: bash
        run: |
          out="$RUNNER_TEMP/npm-candidate"
          mkdir -p "$out"
          npm pack --json --ignore-scripts --pack-destination "$out" > "$out/pack.json"
          cd "$out"
          sha256sum -- *.tgz | tee SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: npm-candidate
          path: ${{ runner.temp }}/npm-candidate
          if-no-files-found: error

  test:
    name: Node ${{ matrix.node }} on ${{ matrix.os }}
    needs: package
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        # 22 is the oldest supported line (engines.node >= 22); 24 is current LTS at the time of writing;
        # lts/* follows whatever is the newest LTS when the job runs.
        node: [22, 24, 'lts/*']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}

      - name: Environment
        shell: bash
        run: |
          node --version
          npm --version
          git config --get core.autocrlf || echo "core.autocrlf unset"
          node -e "console.log(process.platform, process.arch, require('os').tmpdir())"

      - name: Install (no dependencies; verifies the lockfile)
        run: npm ci

      # Includes: path normalisation, symlink behaviour (tests skip themselves where the OS
      # forbids creating symlinks), file permissions (POSIX only), ReDoS regressions, CLI exit
      # codes via real child processes, and byte-for-byte determinism.
      - name: Test
        run: npm test

      - name: CLI smoke test
        shell: bash
        run: |
          node bin/contextanvil.js --version
          node bin/contextanvil.js --help > /dev/null
          node bin/contextanvil.js scan . > /dev/null
          node bin/contextanvil.js context "update the scanner" . > /dev/null
          node bin/contextanvil.js doctor .
          # usage errors must exit 2, runtime errors 3
          set +e
          node bin/contextanvil.js nonsense > /dev/null 2>&1; test $? -eq 2 || { echo "expected exit 2"; exit 1; }
          node bin/contextanvil.js scan ./does-not-exist > /dev/null 2>&1; test $? -eq 3 || { echo "expected exit 3"; exit 1; }

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: npm-candidate
          path: ${{ runner.temp }}/npm-candidate

      - name: Install and smoke-test the exact npm tarball
        shell: bash
        run: |
          out="$RUNNER_TEMP/npm-candidate"
          artifact=$(node -p "require('./package.json').name + '-' + require('./package.json').version + '.tgz'")
          node -e "const fs=require('node:fs'); const crypto=require('node:crypto'); const [file,sums]=process.argv.slice(1); if (crypto.createHash('sha256').update(fs.readFileSync(file)).digest('hex') !== fs.readFileSync(sums,'utf8').split(/\s/)[0]) process.exit(1)" "$out/$artifact" "$out/SHA256SUMS"
          install="$RUNNER_TEMP/contextanvil-package"
          mkdir -p "$install"
          npm install --prefix "$install" --ignore-scripts --offline --no-audit --no-save --package-lock=false "$out/$artifact"
          (cd "$install" && npm exec --offline -- contextanvil --version)
          node bench/release-smoke.js "$install"

      - name: Output is identical between two runs in separate processes
        shell: bash
        run: |
          # Write outside the scanned directory: files created inside it would change what the second run sees.
          out="$RUNNER_TEMP/determinism"
          mkdir -p "$out"
          node bin/contextanvil.js scan . --json > "$out/run1.json"
          node bin/contextanvil.js scan . --json > "$out/run2.json"
          cmp "$out/run1.json" "$out/run2.json"
          node bin/contextanvil.js context "update the scanner" . --json > "$out/pack1.json"
          node bin/contextanvil.js context "update the scanner" . --json > "$out/pack2.json"
          cmp "$out/pack1.json" "$out/pack2.json"
          git status --porcelain | tee "$out/status.txt"
          test ! -s "$out/status.txt" || { echo "the CLI modified the working tree"; exit 1; }

      - name: Cross-platform determinism digest
        shell: bash
        run: DIGEST_DUMP="$RUNNER_TEMP/digest-dump" node bench/digest.js > "$RUNNER_TEMP/digest.json" && cat "$RUNNER_TEMP/digest.json"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: digest-${{ matrix.os }}-node-${{ matrix.node == 'lts/*' && 'lts' || matrix.node }}
          path: |
            ${{ runner.temp }}/digest.json
            ${{ runner.temp }}/digest-dump

  determinism-across-platforms:
    name: Same output on every OS and Node version
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: digest-*
          path: digests
      - name: Compare digests
        shell: bash
        run: |
          ls -R digests
          first=$(ls digests/*/digest.json | head -1)
          for f in digests/*/digest.json; do
            if ! cmp -s "$first" "$f"; then
              echo "DIFFERENT OUTPUT: $f vs $first"; cat "$first" "$f"; exit 1
            fi
          done
          echo "All $(ls digests/*/digest.json | wc -l) digests are identical"

  benchmark-smoke:
    name: Benchmark harness runs
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      # Quality and determinism only. Timings from shared CI runners are noisy and are not asserted.
      - run: node bench/run.js --quick --out bench-ci.json --md bench-ci.md
      - run: |
          node -e "
          const r = require('./bench-ci.json');
          if (!r.determinism.every((d) => d.crossProcessIdentical)) { console.error('non-deterministic output'); process.exit(1); }
          console.log('benchmark ok; synthetic MRR', r.summary.synthetic.all.MRR, 'real MRR', r.summary.real.all.MRR);
          "
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: benchmark-quick
          path: |
            bench-ci.json
            bench-ci.md
